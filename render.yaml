# Render — Static Site (חינמי, לא נרדם). האתר מתעדכן אוטומטית מכל Commit ב־GitHub.
# הנתונים לא נשמרים ב־Render: הם נשמרים בגיליון Google Sheets דרך Google Apps Script (ראו README).
services:
  - type: web
    name: kesher-4u
    runtime: static
    buildCommand: echo "no build needed"
    staticPublishPath: ./web
    autoDeploy: true
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
      - path: /settings.js
        name: Cache-Control
        value: no-cache
